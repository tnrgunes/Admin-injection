<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Inkjection | Secure Admin</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/kX47vXzS/tattoo-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.3/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --card: #141210;
            --card-border: rgba(212,175,55,0.16);
            --gray: #262220;
            --gold: #d4af37;
            --gold-soft: #ecd48a;
            --gold-dim: rgba(212,175,55,0.14);
            --gold-grad: linear-gradient(135deg, #f0d98c 0%, #d4af37 45%, #a9812a 100%);
            --accent: var(--gold);
            --blue: var(--gold);
            --red: #c1121f;
            --green: var(--gold);
            --text: #f4efe4;
            --text-dim: #9c9186;
        }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(ellipse at top, rgba(212,175,55,0.07), transparent 55%), var(--bg);
            color: var(--text);
            margin: 0;
            padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        #auth-container { width: 100%; max-width: 350px; text-align: center; padding: 20px; }
        #user-select { display: flex; flex-direction: column; gap: 15px; }
        .user-choice-btn {
            background: var(--card);
            border: 1px solid var(--card-border);
            color: var(--gold-soft);
            padding: 25px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Playfair Display', serif;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
        }
        .user-choice-btn:active { background: var(--gold-dim); border-color: var(--gold); }
        #pin-screen { display: none; }
        .pin-input {
            width: 100%;
            padding: 18px;
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            color: #fff;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            margin: 20px 0;
            outline: none;
        }
        .pin-input:focus { border-color: var(--gold); }
        #admin-panel { display: none; width: 100%; max-width: 500px; padding: 15px; align-self: flex-start; box-sizing: border-box; }
        .header { text-align: center; padding: 25px 0; border-bottom: 1px solid var(--card-border); margin-bottom: 25px; }
        .header h1 { font-family: 'Playfair Display', serif; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .user-badge { font-size: 10px; color: var(--gold-soft); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; display: block; }
        .tabs { display: flex; gap: 8px; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 14px 8px; border-radius: 14px; border: 1px solid var(--card-border); background: var(--card); color: var(--text-dim); cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; transition: 0.2s; }
        .tab-btn.active { background: var(--gold-grad); color: #000; border-color: transparent; box-shadow: 0 4px 16px rgba(212,175,55,0.25); }
        .section { display: none; }
        .section.active { display: block; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--card); border: 1px solid var(--card-border); padding: 10px; border-radius: 12px; }
        .cal-header h3 { font-family: 'Playfair Display', serif; letter-spacing: 2px; color: var(--gold-soft); }
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: var(--card); border-radius: 12px; font-size: 14px; cursor: pointer; border: 1px solid var(--card-border); }
        .day.past { opacity: 0.2; pointer-events: none; }
        .day.today { border-color: var(--gold); color: var(--gold); font-weight: 800; }
        .day.booked { background: rgba(193, 18, 31, 0.15); border-color: var(--red); color: #ff6b6b; font-weight: 700; }
        .day.other-month { opacity: 0; pointer-events: none; }
        .media-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--card-border); margin-bottom: 25px; }
        .external-link { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--gold-grad); color: #000; text-decoration: none; padding: 15px; border-radius: 12px; font-weight: 800; font-size: 14px; margin-bottom: 20px; letter-spacing: 0.5px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .img-card { position: relative; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--card-border); transition: transform 0.2s, box-shadow 0.2s; }
        .img-card img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .del-btn { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); border: none; color: var(--red); border-radius: 5px; padding: 5px; cursor: pointer; z-index: 5; }
        .img-card .drag-handle { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.6); border: none; color: var(--gold-soft); border-radius: 5px; padding: 5px 7px; font-size: 12px; z-index: 5; cursor: grab; }
        .img-card.sortable-ghost { opacity: 0.4; transform: scale(0.95); }
        .img-card.sortable-chosen { box-shadow: 0 0 20px rgba(212,175,55,0.5); transform: scale(1.05); z-index: 10; border-color: var(--gold); }
        .order-badge { position: absolute; bottom: 5px; left: 5px; background: var(--gold-grad); color: #000; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 5px; z-index: 5; }
        .reorder-hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-bottom: 12px; letter-spacing: 0.5px; }
        .save-order-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--gold-grad); color: #000; font-weight: 800; cursor: pointer; font-size: 13px; letter-spacing: 1px; margin-bottom: 20px; display: none; }
        .save-order-btn.visible { display: block; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--card-border); background: #000; color: #fff; margin: 8px 0; box-sizing: border-box; font-family: inherit; font-size: 14px; outline: none; }
        input[type="text"]:focus, input[type="number"]:focus, textarea:focus { border-color: var(--gold); }
        textarea { resize: vertical; min-height: 60px; }
        .btn-white { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--gold-grad); color: #000; font-weight: 800; cursor: pointer; font-size: 14px; letter-spacing: 1px; }
        .btn-green { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--gold-grad); color: #000; font-weight: 800; cursor: pointer; font-size: 14px; letter-spacing: 1px; }

        .design-admin-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .design-admin-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; overflow: hidden; }
        .design-admin-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
        .design-admin-card-info { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .design-admin-card-info .design-meta { flex: 1; }
        .design-admin-card-info .design-meta .d-price { font-weight: 800; font-size: 16px; color: var(--gold-soft); }
        .design-admin-card-info .design-meta .d-desc { font-size: 12px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
        .design-admin-card-info .design-del { background: rgba(193,18,31,0.15); border: 1px solid var(--red); color: #ff6b6b; border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px; }
        .design-admin-card-actions { display: flex; gap: 8px; align-items: center; }
        .design-edit-btn { background: var(--gold-dim); border: 1px solid var(--gold); color: var(--gold-soft); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; min-height: 44px; }
        .design-del i, .design-sold-btn i { pointer-events: none; }
        .design-sold-btn { background: rgba(255,165,0,0.15); border: 1px solid #ff9500; color: #ff9500; border-radius: 10px; padding: 10px 12px; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
        .design-sold-btn.is-sold { background: rgba(193,18,31,0.15); border-color: var(--red); color: #ff6b6b; }
        .d-old-price { text-decoration: line-through; color: #6b6459; font-size: 13px; margin-right: 8px; }
        .d-discount-price { color: var(--gold-soft); font-weight: 800; font-size: 16px; }
        .d-sold-badge { display: inline-block; background: var(--red); color: #fff; font-size: 10px; font-weight: 800; padding: 3px 8px; border-radius: 5px; letter-spacing: 1px; margin-left: 8px; }
        .edit-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; align-items: center; justify-content: center; }
        .edit-modal-overlay.active { display: flex; }
        .edit-modal { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 25px; width: 90%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
        .edit-modal h3 { margin: 0 0 15px; font-size: 16px; letter-spacing: 2px; font-family: 'Playfair Display', serif; color: var(--gold-soft); }
        .edit-modal .btn-row { display: flex; gap: 10px; margin-top: 15px; }
        .edit-modal .btn-row button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 13px; }
        .edit-cancel { background: var(--gray); color: #fff; }
        .edit-save { background: var(--gold-grad); color: #000; }
        .form-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; margin-top: 12px; display: block; }
    </style>
</head>
<body>

<div id="auth-container">
    <div style="font-family:'Playfair Display', serif; font-size: 26px; font-weight: 800; letter-spacing: 6px; margin-bottom: 40px; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">INKJECTION</div>
    <div id="user-select">
        <button class="user-choice-btn" onclick="selectUser('Taner')">TANER</button>
        <button class="user-choice-btn" onclick="selectUser('Talitha')">TALITHA</button>
    </div>
    <div id="pin-screen">
        <div id="pin-title" style="font-size: 12px; color: #a89a7a; letter-spacing: 2px;"></div>
        <input type="password" id="admin-pin" class="pin-input" maxlength="4" placeholder="••••" pattern="\d*" inputmode="numeric" oninput="validatePin(this.value)">
        <button onclick="goBack()" style="background:none; border:none; color:#5a5248; font-size:12px; cursor:pointer;"><i class="fas fa-arrow-left"></i> GO BACK</button>
    </div>
</div>

<div id="admin-panel">
    <div class="header">
        <h1 style="margin:0; font-size: 22px; letter-spacing: 5px;">INKJECTION</h1>
        <span id="welcome-user" class="user-badge"></span>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-cal', this)">CALENDAR</button>
        <button class="tab-btn" onclick="switchTab('tab-gal', this)">GALLERY</button>
        <button class="tab-btn" onclick="switchTab('tab-designs', this)">DESIGNS</button>
    </div>

    <!-- CALENDAR TAB -->
    <div id="tab-cal" class="section active">
        <div class="cal-header">
            <button onclick="changeMonth(-1)" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-chevron-left"></i></button>
            <h3 id="monthDisplay"></h3>
            <button onclick="changeMonth(1)" style="background:none; border:none; color:#fff; cursor:pointer;"><i class="fas fa-chevron-right"></i></button>
        </div>
        <div class="days-grid" id="adminDays"></div>
    </div>

    <!-- GALLERY TAB -->
    <div id="tab-gal" class="section">
        <div class="media-box">
            <a href="https://postimages.org/" target="_blank" class="external-link"><i class="fas fa-upload"></i> OPEN POSTIMAGES</a>
            <input type="text" id="img-url" placeholder="Paste Direct Link here...">
            <button class="btn-white" onclick="savePhoto()">PUBLISH PHOTO</button>
        </div>
        <div class="reorder-hint"><i class="fas fa-grip-vertical"></i> Hold &amp; drag photos to reorder</div>
        <button class="save-order-btn" id="saveOrderBtn" onclick="saveOrder()">SAVE NEW ORDER</button>
        <div class="gallery-grid" id="adminGallery"></div>
    </div>

    <!-- DESIGNS TAB -->
    <div id="tab-designs" class="section">
        <div class="media-box">
            <a href="https://postimages.org/" target="_blank" class="external-link"><i class="fas fa-upload"></i> OPEN POSTIMAGES</a>
            <span class="form-label">Image URL</span>
            <input type="text" id="design-url" placeholder="Paste Direct Link here...">
            <span class="form-label">Price (€)</span>
            <input type="number" id="design-price" placeholder="e.g. 120">
            <span class="form-label">Description</span>
            <textarea id="design-desc" placeholder="e.g. Fine line butterfly, 8cm, arm/ankle"></textarea>
            <div style="margin-top: 15px;">
                <button class="btn-green" onclick="saveDesign()">PUBLISH DESIGN</button>
            </div>
        </div>
        <div class="design-admin-grid" id="adminDesigns"></div>
    </div>

    <button onclick="location.reload()" style="width:100%; padding:40px; background:none; border:none; color:#5a5248; font-size:11px; cursor:pointer;">LOGOUT</button>
</div>

<!-- EDIT DESIGN MODAL -->
<div class="edit-modal-overlay" id="editModal">
    <div class="edit-modal">
        <h3>EDIT DESIGN</h3>
        <input type="hidden" id="edit-id">
        <span class="form-label" style="display:block;color:#a89a7a;font-size:11px;letter-spacing:1.5px;font-weight:700;margin-top:0;">Price (&euro;)</span>
        <input type="number" id="edit-price" placeholder="Price" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(212,175,55,0.25);background:#000;color:#fff;margin:6px 0;font-size:14px;outline:none;">
        <span class="form-label" style="display:block;color:#a89a7a;font-size:11px;letter-spacing:1.5px;font-weight:700;margin-top:10px;">Discount Price (&euro;) <span style="font-weight:400;color:#5a5248;">— leave empty for no discount</span></span>
        <input type="number" id="edit-discount" placeholder="Discount price (optional)" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(212,175,55,0.25);background:#000;color:#fff;margin:6px 0;font-size:14px;outline:none;">
        <span class="form-label" style="display:block;color:#a89a7a;font-size:11px;letter-spacing:1.5px;font-weight:700;margin-top:10px;">Description</span>
        <textarea id="edit-desc" placeholder="Description" style="width:100%;padding:14px;border-radius:12px;border:1px solid rgba(212,175,55,0.25);background:#000;color:#fff;margin:6px 0;font-size:14px;outline:none;resize:vertical;min-height:60px;font-family:inherit;"></textarea>
        <div class="btn-row" style="display:flex;gap:10px;margin-top:15px;">
            <button class="edit-cancel" onclick="closeEditModal()" style="flex:1;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:13px;background:#262220;color:#fff;">CANCEL</button>
            <button class="edit-save" onclick="saveEdit()" style="flex:1;padding:14px;border-radius:12px;border:none;font-weight:700;cursor:pointer;font-size:13px;background:linear-gradient(135deg, #f0d98c 0%, #d4af37 45%, #a9812a 100%);color:#000;">SAVE</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyA5e7A-Ha8dJWj5dUE_j_g3WeD0QhrDkZY", authDomain: "inkjection-admin.firebaseapp.com", projectId: "inkjection-admin", storageBucket: "inkjection-admin.firebasestorage.app", messagingSenderId: "272546510196", appId: "1:272546510196:web:ac81ad4ce4c3ce1db82821" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let selectedUser = "";
    const userAccess = { "Taner": "2135", "Talitha": "2808" };
    const now = new Date();
    const realToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    let currentMonth = now.getMonth(), currentYear = now.getFullYear();
    let blockedDates = new Set();
    let galleryDocs = [];
    let orderChanged = false;
    let sortableInstance = null;

    function selectUser(user) {
        selectedUser = user;
        document.getElementById('user-select').style.display = 'none';
        document.getElementById('pin-screen').style.display = 'block';
        document.getElementById('pin-title').innerText = 'ENTER PIN FOR ' + user.toUpperCase();
        document.getElementById('admin-pin').focus();
    }

    function goBack() {
        document.getElementById('user-select').style.display = 'flex';
        document.getElementById('pin-screen').style.display = 'none';
        document.getElementById('admin-pin').value = '';
    }

    function validatePin(val) {
        if(val === userAccess[selectedUser]) {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            document.getElementById('welcome-user').innerText = 'Welcome, ' + selectedUser;
            loadBlockedDates();
        } else if (val.length === 4) {
            alert("Incorrect PIN!");
            document.getElementById('admin-pin').value = '';
        }
    }

    async function loadBlockedDates() {
        const snap = await db.collection("blockedDays").get();
        blockedDates.clear();
        snap.forEach(doc => blockedDates.add(doc.id));
        renderCalendar();
    }

    function renderCalendar() {
        const grid = document.getElementById('adminDays');
        const months = ["JANUARY","FEBRUARY","MARCH","APRIL","MAY","JUNE","JULY","AUGUST","SEPTEMBER","OCTOBER","NOVEMBER","DECEMBER"];
        document.getElementById('monthDisplay').innerText = months[currentMonth] + ' ' + currentYear;
        grid.innerHTML = "";
        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const shift = (firstDay === 0 ? 6 : firstDay - 1);
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
        for(let i=0; i<shift; i++) grid.innerHTML += '<div class="day other-month"></div>';
        for(let d=1; d<=totalDays; d++) {
            const thisDate = new Date(currentYear, currentMonth, d);
            const dateStr = currentYear + '-' + (currentMonth+1).toString().padStart(2,'0') + '-' + d.toString().padStart(2,'0');
            const isBooked = blockedDates.has(dateStr);
            const isPast = thisDate < realToday;
            const isToday = thisDate.getTime() === realToday.getTime();
            grid.innerHTML += '<div class="day ' + (isPast?'past':'') + ' ' + (isToday?'today':'') + ' ' + (isBooked?'booked':'') + '" onclick="' + (!isPast ? "toggleDate('" + dateStr + "', " + isBooked + ")" : '') + '">' + d + '</div>';
        }
    }

    async function toggleDate(dateStr, currentlyBooked) {
        if(confirm('Are you sure you want to ' + (currentlyBooked ? 'OPEN' : 'BLOCK') + ' ' + dateStr + '?')) {
            const ref = db.collection("blockedDays").doc(dateStr);
            if(currentlyBooked) await ref.delete(); else await ref.set({status: 'booked'});
            loadBlockedDates();
        }
    }

    function changeMonth(dir) {
        currentMonth += dir;
        if(currentMonth > 11) { currentMonth = 0; currentYear++; } else if(currentMonth < 0) { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    function switchTab(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
        if(id === 'tab-gal') fetchGallery();
        if(id === 'tab-designs') fetchAdminDesigns();
    }

    // --- GALLERY WITH DRAG & DROP ---
    async function fetchGallery() {
        const grid = document.getElementById('adminGallery');
        let snap = await db.collection("photos").get();
        let allDocs = [];
        snap.forEach(doc => { allDocs.push({ id: doc.id, data: doc.data() }); });
        allDocs.sort(function(a, b) {
            var oa = a.data.order !== undefined ? a.data.order : 999999;
            var ob = b.data.order !== undefined ? b.data.order : 999999;
            if(oa === ob) {
                var ta = a.data.createdAt ? a.data.createdAt.seconds : 0;
                var tb = b.data.createdAt ? b.data.createdAt.seconds : 0;
                return tb - ta;
            }
            return oa - ob;
        });
        grid.innerHTML = "";
        galleryDocs = [];
        let idx = 0;
        allDocs.forEach(function(item) {
            var d = item.data;
            galleryDocs.push({ id: item.id, url: d.url, order: d.order !== undefined ? d.order : idx });
            grid.innerHTML += '<div class="img-card" data-id="' + item.id + '">'
                + '<span class="drag-handle"><i class="fas fa-grip-vertical"></i></span>'
                + '<img src="' + d.url + '">'
                + '<span class="order-badge">' + (idx + 1) + '</span>'
                + '<button class="del-btn" onclick="event.stopPropagation(); deletePhoto(\'' + item.id + '\')"><i class="fas fa-trash"></i></button>'
                + '</div>';
            idx++;
        });

        orderChanged = false;
        document.getElementById('saveOrderBtn').classList.remove('visible');

        if(sortableInstance) sortableInstance.destroy();
        sortableInstance = new Sortable(grid, {
            animation: 200,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            chosenClass: 'sortable-chosen',
            delay: 150,
            delayOnTouchOnly: true,
            touchStartThreshold: 5,
            onEnd: function() {
                orderChanged = true;
                document.getElementById('saveOrderBtn').classList.add('visible');
                updateOrderBadges();
            }
        });
    }

    function updateOrderBadges() {
        const cards = document.querySelectorAll('#adminGallery .img-card');
        cards.forEach(function(card, i) {
            var badge = card.querySelector('.order-badge');
            if(badge) badge.textContent = (i + 1);
        });
    }

    async function saveOrder() {
        const btn = document.getElementById('saveOrderBtn');
        btn.textContent = 'SAVING...';
        btn.disabled = true;
        const cards = document.querySelectorAll('#adminGallery .img-card');
        const batch = db.batch();
        cards.forEach(function(card, i) {
            const docId = card.getAttribute('data-id');
            const ref = db.collection("photos").doc(docId);
            batch.update(ref, { order: i });
        });
        await batch.commit();
        btn.textContent = 'SAVED!';
        setTimeout(function() {
            btn.textContent = 'SAVE NEW ORDER';
            btn.disabled = false;
            btn.classList.remove('visible');
            orderChanged = false;
        }, 1500);
    }

    async function savePhoto() {
        const url = document.getElementById('img-url').value.trim();
        if(url && confirm("Are you sure you want to publish this photo?")) {
            const snap = await db.collection("photos").get();
            const newOrder = snap.size;
            await db.collection("photos").add({ url: url, order: newOrder, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            document.getElementById('img-url').value = ""; fetchGallery();
        }
    }

    async function deletePhoto(id) {
        if(confirm("Are you sure you want to delete this photo?")) {
            await db.collection("photos").doc(id).delete();
            fetchGallery();
        }
    }

    // --- DESIGNS ---
    async function fetchAdminDesigns() {
        const grid = document.getElementById('adminDesigns');
        const snap = await db.collection("designs").orderBy("createdAt", "desc").get();
        grid.innerHTML = "";
        if(snap.empty) {
            grid.innerHTML = '<div style="text-align:center; padding:30px; color:#555; font-size:13px;">No designs yet. Add your first design above.</div>';
            return;
        }
        snap.forEach(doc => {
            const d = doc.data();
            const isSold = d.sold === true;
            const hasDiscount = d.discountPrice && d.discountPrice !== '';
            let priceHtml = '';
            if(d.price) {
                if(hasDiscount) {
                    priceHtml = '<span class="d-old-price">€' + d.price + '</span><span class="d-discount-price">€' + d.discountPrice + '</span>';
                } else {
                    priceHtml = '<span class="d-discount-price">€' + d.price + '</span>';
                }
            } else {
                priceHtml = '<span style="color:#555">No price</span>';
            }
            if(isSold) priceHtml += '<span class="d-sold-badge">SOLD</span>';
            const desc = d.description || '';
            const soldBtnText = isSold ? 'UNSOLD' : 'SOLD';
            const soldBtnClass = isSold ? 'design-sold-btn is-sold' : 'design-sold-btn';

            const cardEl = document.createElement('div');
            cardEl.className = 'design-admin-card';
            if(isSold) cardEl.style.opacity = '0.5';
            cardEl.innerHTML = '<img src="' + d.url + '">'
                + '<div class="design-admin-card-info">'
                + '<div class="design-meta">'
                + '<div class="d-price">' + priceHtml + '</div>'
                + (desc ? '<div class="d-desc"></div>' : '')
                + '</div>'
                + '<div class="design-admin-card-actions">'
                + '<button class="' + soldBtnClass + '">' + soldBtnText + '</button>'
                + '<button class="design-edit-btn">EDIT</button>'
                + '<button class="design-del"><i class="fas fa-trash"></i></button>'
                + '</div>'
                + '</div>';

            if(desc) {
                const descEl = cardEl.querySelector('.d-desc');
                if(descEl) descEl.textContent = desc;
            }

            const soldBtn = cardEl.querySelector('.design-sold-btn');
            soldBtn.addEventListener('click', function() { toggleSold(doc.id, isSold); });

            const editBtn = cardEl.querySelector('.design-edit-btn');
            editBtn.addEventListener('click', function() { openEditModal(doc.id, d.price || '', d.discountPrice || '', desc); });

            const delBtn = cardEl.querySelector('.design-del');
            delBtn.addEventListener('click', function() { deleteDesign(doc.id); });

            grid.appendChild(cardEl);
        });
    }

    async function saveDesign() {
        const url = document.getElementById('design-url').value.trim();
        const price = document.getElementById('design-price').value.trim();
        const desc = document.getElementById('design-desc').value.trim();

        if(!url) { alert("Please paste an image URL."); return; }
        if(!confirm("Publish this design?")) return;

        await db.collection("designs").add({
            url: url,
            price: price || '',
            discountPrice: '',
            description: desc || '',
            sold: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('design-url').value = '';
        document.getElementById('design-price').value = '';
        document.getElementById('design-desc').value = '';
        fetchAdminDesigns();
    }

    async function deleteDesign(id) {
        if(confirm("Are you sure you want to delete this design?")) {
            await db.collection("designs").doc(id).delete();
            fetchAdminDesigns();
        }
    }

    async function toggleSold(id, currentlySold) {
        await db.collection("designs").doc(id).update({ sold: !currentlySold });
        fetchAdminDesigns();
    }

    function openEditModal(id, price, discount, desc) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-price').value = price;
        document.getElementById('edit-discount').value = discount;
        document.getElementById('edit-desc').value = desc;
        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    async function saveEdit() {
        const id = document.getElementById('edit-id').value;
        const price = document.getElementById('edit-price').value.trim();
        const discount = document.getElementById('edit-discount').value.trim();
        const desc = document.getElementById('edit-desc').value.trim();
        await db.collection("designs").doc(id).update({
            price: price || '',
            discountPrice: discount || '',
            description: desc || ''
        });
        closeEditModal();
        fetchAdminDesigns();
    }
</script>

</body>
</html>
